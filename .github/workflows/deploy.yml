name: Deploy Scry MCP

# PRs validate only. Pushes to stage/main deploy staging/production.

on:
  pull_request:
    branches:
      - main
      - stage
  push:
    branches:
      - main
      - stage
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # This repo uses npm (package-lock.json), unlike the pnpm services.
      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Must precede the tests. @cloudflare/vitest-pool-workers reads
      # wrangler.jsonc, including assets.directory (./web/dist/widgets) — a
      # build output that is gitignored and so absent on a fresh checkout.
      # Without this the whole suite aborts before collecting a single test.
      # It also means a broken widget build fails the PR rather than the deploy,
      # since wrangler runs the same command via its build.command hook.
      - name: Build Widgets
        run: npm run build:widgets

      - name: Run Tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/stage' && 'staging' || 'production') }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' || github.event_name == 'push' && github.ref == 'refs/heads/stage') && 'https://scry-mcp-staging.epinnock.workers.dev' || 'https://scry-mcp.epinnock.workers.dev' }}
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) ||
      github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/stage' && 'staging' || 'production') }}
      BASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' || github.event_name == 'push' && github.ref == 'refs/heads/stage') && 'https://scry-mcp-staging.epinnock.workers.dev' || 'https://scry-mcp.epinnock.workers.dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Evaluate the timestamp in a shell before passing it to wrangler-action.
      - name: Set Build Time
        run: echo "SCRY_BUILD_TIME=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      # wrangler runs `npm run build:widgets` itself via the build.command hook.
      # Production intentionally uses the top-level config and existing worker.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.72.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy ${{ env.DEPLOY_ENV == 'staging' && '--env staging' || '' }}
            --var SCRY_ENV:${{ env.DEPLOY_ENV }}
            --var SCRY_COMMIT:${{ github.sha }}
            --var SCRY_BRANCH:${{ github.ref_name }}
            --var SCRY_BUILD_TIME:${{ env.SCRY_BUILD_TIME }}
            --var SCRY_DEPLOY_ID:${{ github.run_id }}
            --var SCRY_ACTOR:${{ github.actor }}
            --var SENTRY_RELEASE:${{ github.sha }}
            --tag ${{ github.sha }}
            --message "${{ github.ref_name }} ${{ github.actor }} run=${{ github.run_id }}"

      # Cheap post-deploy assertion that the OAuth boundary still behaves:
      # /mcp must challenge (401) and the metadata document must stay public.
      # These public endpoints need no secrets, including on first staging deploy.
      # A worker that boots but answers 500 here is a failed deploy.
      - name: Smoke Test Health and OAuth Endpoints
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if health=$(curl -fsS --max-time 30 "$BASE/healthz") &&
               jq -e --arg commit "$EXPECTED_COMMIT" '.commit == $commit' <<< "$health" > /dev/null; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::/healthz did not report commit $EXPECTED_COMMIT after 6 attempts"
              exit 1
            fi
            echo "Waiting for /healthz to report commit $EXPECTED_COMMIT (attempt $attempt/6)"
            sleep 10
          done
          mcp=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/mcp")
          meta=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                   "$BASE/.well-known/oauth-authorization-server")
          echo "/mcp=$mcp  /.well-known/oauth-authorization-server=$meta"
          [ "$mcp" = "401" ] || { echo "::error::/mcp returned $mcp, expected 401"; exit 1; }
          [ "$meta" = "200" ] || { echo "::error::OAuth metadata returned $meta, expected 200"; exit 1; }

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $BASE" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $DEPLOY_ENV" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
